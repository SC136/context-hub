name: Release

# Push a tag like v1.1.0 to build and publish a release with the installer and a portable exe.
# The tag must match the version in src-tauri/tauri.conf.json.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} doesn't match the app version v$version. Bump the version first."
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Run the tests first
        run: cargo test
        working-directory: src-tauri

      - name: Release notes
        id: notes
        shell: pwsh
        run: |
          $file = "release-notes/${{ github.ref_name }}.md"
          $body = if (Test-Path $file) { Get-Content $file -Raw } else { "See the commit history for what changed." }
          $delim = "EOF_$([guid]::NewGuid().ToString('N'))"
          "body<<$delim`n$body`n$delim" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Context Hub ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

      - name: Add the portable exe and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/context-hub.exe out/Context-Hub_${version}_x64-portable.exe
          Copy-Item "src-tauri/target/release/bundle/nsis/Context Hub_${version}_x64-setup.exe" "out/Context-Hub_${version}_x64-setup.exe"
          Get-ChildItem out -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content out/SHA256SUMS.txt
          gh release upload $tag out/Context-Hub_${version}_x64-portable.exe out/SHA256SUMS.txt --clobber
