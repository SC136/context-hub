[package]
name = "context-hub"
version = "1.1.1"
description = "Context Hub - AI session browser"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[profile.release]
opt-level = "s"
lto = true
