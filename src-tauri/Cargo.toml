[package]
name = "context-hub"
version = "1.2.0"
description = "Context Hub - AI session browser"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tauri-plugin-updater = "2.14.1"

[profile.release]
opt-level = "s"
lto = true
